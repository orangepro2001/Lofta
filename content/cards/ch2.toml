# Chapter 2 cards. Ruth learns to read a table, and Bowell's body teaches her what a table is worth.

[[card]]
id = "c2_bess"
kind = "fact"
title = "贝丝一例"
text = "科文特花园水果贩贝丝·凯特尔，35 岁，6月11日，星期四死，记“热病”。左上臂有圆疤，留着先令存根和一只蓝瓶。"
source = "贝丝的遗物"
chapter = 2
tags = ["case_dead"]

[[card]]
id = "c2_jonas"
kind = "fact"
title = "乔纳斯一例"
text = "斯皮塔佛德织工乔纳斯·里德，33 岁，8月9日，星期日死，当地报“绞肠”。左上臂有圆疤，诗篇里夹着一沓存根，枕下有蓝瓶。"
source = "亲眼所见"
chapter = 2
tags = ["case_dead"]

[[card]]
id = "c2_bowell_body"
kind = "fact"
title = "鲍尔大娘的尸首"
text = "吐过，渴过，手按在肚子上，和南一样。嘴里酒气冲人，邻妇说这回可是真喝死的。两臂都没有圆疤，衣边没有存根，枕下没有蓝瓶。"
source = "亲手查验"
chapter = 2
tags = ["no_stub", "has_spirit"]

[[card]]
