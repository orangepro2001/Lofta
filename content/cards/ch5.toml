text = "玛德莱娜在鹿特丹的通信人写道：9月11日星期一，她舅舅的铺子里来了一位佩雷拉先生，打听多德雷赫特的纸。"
source = "玛德莱娜的荷兰通信"
chapter = 5
tags = ["second_way"]

[[card]]
