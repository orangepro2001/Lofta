[[card]]
id = "c5_clean_wine"
kind = "fact"
title = "马德拉酒无毒，药瓶有毒"
text = "马德拉的酒脚上了红铁，只有焦糖味。床头达菲药酒的瓶底白渣冒浓白烟，蒜臭，勺背结白华。"
source = "亲手试验"
chapter = 5
tags = ["clean_wine"]

[[card]]
id = "c5_anon_letter"
kind = "fact"
title = "印的匿名信"
text = "寄到弓街，印的，没有落款，告发摩西·佩雷拉。信上每个小写的 g 都缺了尾巴，缺在同一处。"
source = "弓街的邮件"
chapter = 5
tags = ["broken_g"]

[[card]]
id = "c5_wine_prop"
kind = "inference"
title = "酒是摆给人看的"
text = "酒里没有毒，匿名信却咬定送酒的人。有人要大家都看那瓶酒。"
source = "合成"
chapter = 5
tags = ["wine_prop"]

[[card]]
id = "c5_sly_oath"
kind = "testimony"
title = "斯莱的誓"
text = "斯莱发誓，9月2日黄昏，星期三，他在高级律师公会门口见过佩雷拉，手里提着一只瓶子。"
source = "斯莱"
chapter = 5
tags = ["sly_oath"]

[[card]]
id = "c5_sly_trade"
kind = "testimony"
title = "吃证人饭的"
text = "斯莱常年在老贝利门口等活，半克朗一个誓。街上都这么说。"
source = "街谈"
chapter = 5
tags = ["sly_trade"]

[[card]]
id = "c5_chaplain"
kind = "fact"
title = "牧师副署的收据"
text = "鹿特丹公证人的收据，星期三，9月13日，佩雷拉本人付讫。英国人教堂牧师副署：“此人亲到我面前。日子是真的。”"
source = "佩雷拉的收据"
chapter = 5
tags = ["chaplain"]

[[card]]
id = "c5_date_talk"
kind = "testimony"
title = "英国没有九月十三"
six = true
text = "老塔克说：8月26日佩雷拉在盖尔那里吵过。英国的历书上没有九月十三。他说是皮姆先生喝多了讲的。"
source = "老塔克"
chapter = 5
tags = ["date_talk", "pym_said"]

[[card]]
id = "c5_no_skip"
kind = "inference"
title = "星期不跳"
text = "新式9月13日是星期三，旧式9月2日也是星期三。日子跳了十一个，星期没有跳。收据上那天就是斯莱发誓那天。"
source = "合成"
chapter = 5
tags = ["no_skip"]

