# Test cards. Kinds: fact, rule, inference, testimony, fallacy.
[[card]]
id = "c_demo_no_gin"
kind = "testimony"
title = "滴酒不沾"
text = "街坊说死者从不喝酒。"
source = "街坊"
tags = ["never_drank"]

[[card]]
id = "c_demo_garlic"
kind = "fact"
title = "蒜味"
text = "死者舌根有蒜一样的气味，身上没有酒气。"
source = "亲眼所见"
tags = ["no_spirit"]

[[card]]
id = "c_demo_drunk_rule"
kind = "rule"
title = "醉死者必有酒气"
text = "凡醉死的人，身上都有酒气。"
source = "经验"
certainty = "或然"

[[card]]
id = "c_demo_not_drunk"
kind = "inference"
title = "不是醉死"
text = "死者身上没有酒气，所以她不是醉死的。"
source = "合成"

[[card]]
id = "c_demo_bad"
kind = "fallacy"
title = "一定是中毒"
text = "没有酒气，便断定中毒。"
source = "合成"

[[recipe]]
id = "d_demo_not_drunk"
verb = "deduce"
major = "c_demo_drunk_rule"
minor = "no_spirit"
output = "c_demo_not_drunk"
explain = "大前提：醉死者必有酒气。小前提：死者没有酒气。结论：她不是醉死的。"

[[recipe]]
id = "d_demo_bad"
verb = "deduce"
major = "c_demo_drunk_rule"
minor = "never_drank"
fallacy = "否定前件"
fault = "规律只说醉死的人有酒气，没说不喝酒就不会醉死以外的事。这一步推不出她怎么死的。"
output = "c_demo_bad"
explain = "她从不喝酒，所以她一定是中毒。"

