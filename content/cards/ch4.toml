source = "亲自核对"
chapter = 4
tags = ["letter_lost"]

[[card]]
id = "c4_gale_book"
kind = "fact"
title = "盖尔的札记"
text = "盖尔推给她的札记，用律师的缩写写成。她读得懂的只有日期和数目：访视人每报一次病危，赫尔就买入一笔，一笔对一笔。他只说了一句：“同一只手。”"
source = "盖尔"
chapter = 4
tags = ["gale_book"]

[[card]]
id = "c4_timeline"
kind = "fact"
title = "科布这一夜的路"
text = "门房、船夫、看守各说一段：七点钱送到摩尔菲尔德和弗利特，十一点科布到老天鹅，半夜后沿泰晤士街往西，一点到教堂巷。他整夜没有到过法官巷。"
source = "约翰·菲尔丁"
chapter = 4
tags = ["cobb_timeline"]

