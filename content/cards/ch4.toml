kind = "fact"
title = "盖尔的来信"
text = "盖尔来信：星期三白天外出验命，薄暮方回，本人守到午夜。另起一行小字：公会敲十点落闩，门房只认律师，不认信。契约9月10日届满，他写得很清楚。"
source = "盖尔的信"
chapter = 4
tags = ["last_night", "term_day"]

[[card]]
