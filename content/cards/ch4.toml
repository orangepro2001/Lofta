title = "科布的渡口习惯"
text = "科布要让人落水，总等落潮过了大半才上船：渡船收工，台阶上没有人，桥洞的水声盖过人声。码头上不止一个人这样说。"
source = "码头上的人"
certainty = "或然"
chapter = 4
tags = ["cobb_water"]

