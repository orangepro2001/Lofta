text = "老塔克说，爵士的律师要盯着9月2日的八日验明，一条也不放过。她问他怎么知道，他说是皮姆先生喝多了说的。"
source = "老塔克"
chapter = 4
tags = ["last_night", "pym_said"]

[[card]]
id = "c4_rule_act"
kind = "rule"
title = "两套算法，方向相反"
text = "法院和季审按名义日开庭，日子不改，实际比往年早十一天。集市、租金、利息和一切契约按“各该同样的自然日”，名义上推后十一天。"
source = "约翰·菲尔丁"
certainty = "必然"
chapter = 4
tags = ["rule_act"]

[[card]]
