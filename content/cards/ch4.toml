text = "到期日按自然日是新式9月21日。老贝利的9月14日按名义日开庭，离它只有七天。"
source = "合成"
chapter = 4

[[card]]
id = "c4_no_owner"
kind = "inference"
title = "蓝瓶还没有主人"
text = "科布这一夜走的是水路和楼梯，手下是看护和看守。蓝瓶要的是药铺、瓶子和半年的工夫。抓到他，只抓到了意外那一组。"
source = "合成"
chapter = 4

