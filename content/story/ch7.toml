n = 7
title = "决算"
dates = "1752年12月12日至1753年1月"
# The confrontation takes one slot, Wednesday two, the file and the choice one, the ending and the
# last act two. The second paid scene burns the last three, so the free roam ends there.
slots = 6
start = "ch7_open"
climax = "ch7_case"
required = ["c7_ledger", "c7_rule_wife"]

[finale]
flags = [
  "kitty_alive", "ned_alive", "lucy_alive", "will_alive", "pereira_cleared", "pereira_hanged",
  "crane_taken", "pym_spoke", "holt_found", "gale_book", "bottles_tested", "have_cordial",
  "hannah_stone", "exhumed", "ch1_bill_true", "ch1_took_groat",
]
endings = ["a", "b", "c1", "c2", "d", "e", "f1", "f2"]
min_endings = 2

